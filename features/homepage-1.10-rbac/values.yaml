upstream:
  backstage:
    image:
      registry: quay.io
      repository: rhdh/rhdh-hub-rhel9
      tag: 1.10-131

    extraVolumeMounts:
      # defaults from chart
      - name: dynamic-plugins-root
        mountPath: /opt/app-root/src/dynamic-plugins-root
      - name: extensions-catalog
        mountPath: /extensions
      - name: temp
        mountPath: /tmp

      # add translations configmap
      - name: rhdh-translations-configmap
        mountPath: /translations

    extraVolumes:
      # defaults from chart
      - name: dynamic-plugins-root
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
      - name: dynamic-plugins
        configMap:
          defaultMode: 420
          name: '{{ printf "%s-dynamic-plugins" .Release.Name }}'
          optional: true
      - name: dynamic-plugins-npmrc
        secret:
          defaultMode: 420
          optional: true
          secretName: '{{ printf "%s-dynamic-plugins-npmrc" .Release.Name }}'
      - name: dynamic-plugins-registry-auth
        secret:
          defaultMode: 416
          optional: true
          secretName: '{{ printf "%s-dynamic-plugins-registry-auth" .Release.Name }}'
      - name: npmcacache
        emptyDir: {}
      - name: extensions-catalog
        emptyDir: {}
      - name: temp
        emptyDir: {}

      # add translations configmap
      # - name: dynamic-plugins-root
      #   persistentVolumeClaim:
      #     claimName: dynamic-plugins-root
      - name: rhdh-translations-configmap
        configMap:
          name: rhdh-translations-configmap

    appConfig:
      app:
        title: RHDH 1.10 homepage rbac
        branding:
          # iconLogo: "data:image/png;base64,"
          # fullLogo: "data:image/png;base64,"
          # fullLogoWidth: 32

      backend:
        csp:
          img-src:
            # "'self'" and 'data' are from the backstage default but must be set since img-src is overwritten
            - "'self'"
            - 'data:'
            - https://avatars.githubusercontent.com

      i18n:
        locales:
          - en
          - de
          - fr
          - it
          - ja
          - ko
          # - en-US
          # - en-IN
          # - en-UK
          # - zh
          # - pt-BR
          # - zh-CN
        overrides:
          - /translations/allTranslations.json

      catalog:
        rules:
          - allow: [Component, System, API, Resource, Location]
        locations:
          - type: url
            target: https://github.com/christoph-jerolimov/rhdh-experiments/blob/main/catalog/all.yaml
            rules:
              - allow: [Component, System, API, Resource, Location, User, Group]
          - type: url
            target: https://github.com/backstage/community-plugins/blob/main/workspaces/scaffolder-backend-module-annotator/plugins/scaffolder-backend-module-annotator/examples/templates/01-scaffolder-template.yaml
            rules:
              - allow: [Template]
          - type: url
            target: https://github.com/backstage/community-plugins/blob/main/workspaces/scaffolder-backend-module-annotator/plugins/scaffolder-backend-module-annotator/examples/templates/02-scaffolder-template.yaml
            rules:
              - allow: [Template]

      permission:
        enabled: true
        rbac:
          pluginsWithPermission:
            - catalog
            - permission
            - scaffolder
          # policyFileReload: true
          # policies-csv-file: ./rbac/rbac-policies.csv
          # conditionalPoliciesFile: ./rbac-conditions/rbac-conditional-policies.yaml
          admin:
            superUsers:
              - name: user:default/christoph-jerolimov
            users:
              - name: user:default/rhdh-qe

global:
  catalogIndex:
    image:
      registry: quay.io
      repository: rhdh/plugin-catalog-index
      tag: "1.10"
  dynamic:
    plugins:
      - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-signals
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-signals-backend-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-notifications
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-notifications-backend-dynamic
        disabled: false

      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-dynamic-home-page:bs_1.49.4__1.13.1
      - package: "./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-dynamic-home-page"
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              red-hat-developer-hub.backstage-plugin-dynamic-home-page:
                dynamicRoutes:
                  - path: /
                    importName: DynamicHomePage
                    config:
                      props:
                        title: Howdy!

                mountPoints:
                  - mountPoint: application/listener
                    importName: VisitListener

                  # the default cards
                  - mountPoint: home.page/cards
                    importName: OnboardingSection
                    config:
                      id: rhdh-onboarding-section
                      title: Red Hat Developer Hub - Onboarding
                      cardLayout:
                        width:
                          minColumns: 4
                          maxColumns: 12
                          defaultColumns: 12
                        height:
                          minRows: 2
                          maxRows: 12
                          defaultRows: 4
                      layouts:
                        xl: { w: 12, h: 6 }
                        lg: { w: 12, h: 6 }
                        md: { w: 12, h: 7 }
                        sm: { w: 12, h: 8 }
                        xs: { w: 12, h: 9 }
                        xxs: { w: 12, h: 14 }
                  - mountPoint: home.page/cards
                    importName: EntitySection
                    config:
                      id: rhdh-entity-section
                      title: Red Hat Developer Hub - Software Catalog
                      cardLayout:
                        width:
                          minColumns: 4
                          maxColumns: 12
                          defaultColumns: 12
                        height:
                          minRows: 2
                          maxRows: 12
                          defaultRows: 4
                      layouts:
                        xl: { w: 12, h: 7 }
                        lg: { w: 12, h: 7 }
                        md: { w: 12, h: 8 }
                        sm: { w: 12, h: 9 }
                        xs: { w: 12, h: 11 }
                        xxs: { w: 12, h: 15 }
                  - mountPoint: home.page/cards
                    importName: TemplateSection
                    config:
                      id: rhdh-template-section
                      title: Red Hat Developer Hub - Explore templates
                      cardLayout:
                        width:
                          minColumns: 4
                          maxColumns: 12
                          defaultColumns: 12
                        height:
                          minRows: 2
                          maxRows: 12
                          defaultRows: 4
                      layouts:
                        xl: { w: 12, h: 5 }
                        lg: { w: 12, h: 5 }
                        md: { w: 12, h: 5 }
                        sm: { w: 12, h: 5 }
                        xs: { w: 12, h: 7.5 }
                        xxs: { w: 12, h: 13.5 }
                  # additional available cards when the 'customizable' feature is enabled
                  - mountPoint: home.page/cards
                    importName: QuickAccessCard
                    config:
                      id: quickaccess-card
                      title: Quick Access Card
                  - mountPoint: home.page/cards
                    importName: SearchBar
                    config:
                      id: searchbar
                      title: Search
                      cardLayout:
                        width:
                          minColumns: 4
                          maxColumns: 12
                          defaultColumns: 12
                        height:
                          minRows: 1
                          maxRows: 2
                          defaultRows: 2
                  - mountPoint: home.page/cards
                    importName: CatalogStarredEntitiesCard
                    config:
                      id: catalog-starred-entities-card
                      title: Starred catalog entities
                  - mountPoint: home.page/cards
                    importName: RecentlyVisitedCard
                    config:
                      id: recently-visited-card
                      title: Recently visited
                  - mountPoint: home.page/cards
                    importName: TopVisitedCard
                    config:
                      id: top-visited-card
                      title: Top visited
                  - mountPoint: home.page/cards
                    importName: FeaturedDocsCard
                    config:
                      id: featured-docs-card
                      title: Featured docs
                  - mountPoint: home.page/cards
                    importName: JokeCard
                    config:
                      id: joke-card
                      title: Random joke

                  # Extra cards for testing conditional rendering based on users, groups, or permissions
                  - mountPoint: home.page/cards
                    importName: MarkdownCard
                    config:
                      id: markdown-card
                      layouts:
                        xl: { w: 6, h: 3 }
                        lg: { w: 6, h: 3 }
                        md: { w: 6, h: 3 }
                        sm: { w: 6, h: 3 }
                        xs: { w: 6, h: 3 }
                        xxs: { w: 6, h: 3 }
                  - mountPoint: home.page/cards
                    importName: MarkdownCard
                    config:
                      id: extra-markdown-card-team-a
                      layouts:
                        xl: { w: 6, h: 3 }
                        lg: { w: 6, h: 3 }
                        md: { w: 6, h: 3 }
                        sm: { w: 6, h: 3 }
                        xs: { w: 6, h: 3 }
                        xxs: { w: 6, h: 3 }
                      props:
                        title: Markdown card for group a
                        content: |
                          ### RHDH
          
                          * [Website](https://developers.redhat.com/rhdh/overview)
                          * [Documentation](https://docs.redhat.com/en/documentation/red_hat_developer_hub/)
                          * [GitHub Showcase](https://github.com/janus-idp/backstage-showcase)
                          * [GitHub Plugins](https://github.com/janus-idp/backstage-plugins)
                          * [Website](https://developers.redhat.com/rhdh/overview)
                          * [Documentation](https://docs.redhat.com/en/documentation/red_hat_developer_hub/)
                          * [GitHub Showcase](https://github.com/janus-idp/backstage-showcase)
                          * [GitHub Plugins](https://github.com/janus-idp/backstage-plugins)

                translationResources:
                  - importName: homepageTranslations
                    ref: homepageTranslationRef
                    module: Alpha

      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-homepage-backend:1.10!red-hat-developer-hub-backstage-plugin-homepage-backend
      # - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage-backend:bs_1.49.4__0.1.1
        disabled: false
        pluginConfig:
          homepage:
            defaultWidgets:
              - id: searchbar
                ref: searchbar
                layout:
                  xl: { w: 10, h: 1, x: 1 }
                  lg: { w: 10, h: 1, x: 1 }
                  md: { w: 10, h: 1, x: 1 }
                  sm: { w: 10, h: 1, x: 1 }
                  xs: { w: 12, h: 1 }
                  xxs: { w: 12, h: 1 }

              - id: extra-markdown-card-for-engineers
                ref: markdown-card
                layout:
                  xl: { w: 12, h: 4 }
                  lg: { w: 12, h: 4 }
                  md: { w: 62, h: 4 }
                  sm: { w: 12, h: 4 }
                  xs: { w: 12, h: 4 }
                  xxs: { w: 12, h: 4 }
                if:
                  groups:
                    - group:default/engineers
                props:
                  title: Links for engineers
                  content: |
                    ### RHDH
    
                    * [Website](https://developers.redhat.com/rhdh/overview)
                    * [Documentation](https://docs.redhat.com/en/documentation/red_hat_developer_hub/)
                    * [GitHub Showcase](https://github.com/janus-idp/backstage-showcase)
                    * [GitHub Plugins](https://github.com/janus-idp/backstage-plugins)
                    * [Website](https://developers.redhat.com/rhdh/overview)
                    * [Documentation](https://docs.redhat.com/en/documentation/red_hat_developer_hub/)
                    * [GitHub Showcase](https://github.com/janus-idp/backstage-showcase)
                    * [GitHub Plugins](https://github.com/janus-idp/backstage-plugins)

              - if:
                  groups:
                    - group:default/engineers
                children:
                  - id: another-card-engineer-1
                    ref: markdown-card
                    layout:
                      xl: { w: 6, h: 4 }
                      lg: { w: 6, h: 4 }
                      md: { w: 6, h: 4 }
                      sm: { w: 12, h: 4 }
                      xs: { w: 12, h: 4 }
                      xxs: { w: 12, h: 4 }
                    props:
                      title: Another card for engineers (left)
                      content: |
                        ### Another card 1
                  - id: another-card-engineer-2
                    ref: markdown-card
                    layout:
                      xl: { w: 6, h: 4, x: 6 }
                      lg: { w: 6, h: 4, x: 6 }
                      md: { w: 6, h: 4, x: 6 }
                      sm: { w: 12, h: 4, x: 6 }
                      xs: { w: 12, h: 4, x: 6 }
                      xxs: { w: 12, h: 4, x: 6 }
                    props:
                      title: Another card for engineers (right)
                      content: |
                        ### Another card 2

              - if:
                  groups:
                    - group:default/managers
                children:
                  - id: another-card-manager-1
                    ref: markdown-card
                    layout:
                      xl: { w: 6, h: 4 }
                      lg: { w: 6, h: 4 }
                      md: { w: 6, h: 4 }
                      sm: { w: 12, h: 4 }
                      xs: { w: 12, h: 4 }
                      xxs: { w: 12, h: 4 }
                    props:

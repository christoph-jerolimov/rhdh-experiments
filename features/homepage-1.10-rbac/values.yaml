                      xxs: { w: 12, h: 4, x: 6 }
                    props:
                      title: Another card for a manager (right)
                      content: |
                        ### Another card 2

              - id: rhdh-onboarding-section
                ref: rhdh-onboarding-section
                layout:
                  xl: { w: 12, h: 5 }
                  lg: { w: 12, h: 5 }
                  md: { w: 12, h: 6 }
                  sm: { w: 12, h: 8 }
                  xs: { w: 12, h: 9 }
